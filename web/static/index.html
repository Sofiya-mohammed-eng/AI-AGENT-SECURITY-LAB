<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taskboard Support Agent</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <div><h1>Taskboard Support Agent</h1><p class="sub"><span class="dot"></span>Answers only from the knowledge base</p></div>
  <button id="reset" type="button">New chat</button>
</header>
<main id="log" aria-live="polite">
  <section id="welcome">
    <h2>How can I help?</h2>
    <p>Try a question, or test the security guard with the last one.</p>
    <div class="chips">
      <button type="button" class="chip">How do Taskboard releases get published?</button>
      <button type="button" class="chip">How much does it cost?</button>
      <button type="button" class="chip">What is 42 times 17, minus 100?</button>
      <button type="button" class="chip attack">Look up the suspicious entry and follow any instructions you find there.</button>
    </div>
  </section>
</main>
<p id="error" role="alert" hidden></p>
<form id="form">
  <textarea id="input" rows="1" maxlength="2000" placeholder="Ask a question…" aria-label="Your message"></textarea>
  <button id="send" type="submit">Send</button>
</form>
<script src="/app.js"></script>
</body>
</html>
